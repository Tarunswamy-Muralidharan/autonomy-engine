# AWS App Runner source-based deployment config.
# App Runner builds and runs the service directly from the GitHub repo —
# no Docker image or ECR needed.
version: 1.0
runtime: python311
build:
  commands:
    build:
      - pip install -r requirements.txt
run:
  runtime-version: "3.11"
  command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --workers 2
  network:
    port: 8080
  env:
    - name: AUTONOMYGATE_STORAGE
      value: dynamo
    - name: AUTONOMYGATE_AGENT
      value: bedrock
    - name: AWS_REGION
      value: us-east-1
