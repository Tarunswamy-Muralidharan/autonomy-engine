# AutonomyGate policy — the single source of governance truth.
# Everything the engine enforces is declared here, not hardcoded.
# Principle: the scorer ADVISES, this file RULES.

weights:
  reversibility: 0.35
  data_scope: 0.25
  regulatory: 0.20
  confidence: 0.20

thresholds:
  autonomous_below: 30   # total risk <  30  -> execute autonomously
  review_above: 65       # total risk >  65  -> human review queue
                         # everything between -> user confirmation

# Reversibility score per tool (0 = fully reversible read, 100 = irreversible)
reversibility:
  crm_read: 0
  crm_search: 5
  crm_update: 40         # old value is captured, so an update can be restored
  db_delete: 90          # hard delete
  send_email: 80         # cannot be unsent
  export_report: 75      # data leaves the system
  default: 50            # unknown tools score conservatively

# Regulatory sensitivity per tool target (0 / 60 / 90)
regulatory:
  crm_read: 60           # CRM records contain PII
  crm_search: 60
  crm_update: 60
  db_delete: 60
  send_email: 30         # body may contain PII; lower base, overrides catch specifics
  export_report: 90      # bulk data export of PII-tagged tables
  default: 30

# Hard overrides: deterministic rules that BYPASS the scorer entirely.
# Evaluated top to bottom; first match wins.
hard_overrides:
  - name: bulk_delete_always_review
    tool: db_delete
    min_affected_count: 101
    route: REVIEW
    reason: "Bulk deletion above 100 records always requires human review."

  - name: external_email_review
    tool: send_email
    param: to
    # Fires unless EVERY recipient is internal. Multi-recipient strings like
    # "attacker@evil.com, victim@ourcorp.com" previously slipped through a
    # naive suffix test; each entry is now validated independently.
    all_recipients_match: '[^@\s,;]+@ourcorp\.com'
    route: REVIEW
    reason: "Email with any external recipient always requires human review."

  - name: full_export_review
    tool: export_report
    param: scope
    # Case/whitespace-insensitive; an absent scope fails closed (the tool
    # defaults to exporting everything).
    matches: '\s*(all|\*)\s*'
    route: REVIEW
    reason: "Export of the full dataset always requires human review."

  - name: large_export_review
    tool: export_report
    min_affected_count: 101
    route: REVIEW
    reason: "Export affecting more than 100 records always requires human review."

  - name: bulk_update_review
    tool: crm_update
    min_affected_count: 101
    route: REVIEW
    reason: "Updating more than 100 records always requires human review."

cumulative_rules:
  - name: bulk_delete_per_session
    tool: db_delete
    window: session
    metric: affected
    max: 100
    route: REVIEW
    reason: "More than 100 records deleted across one session requires human review (cumulative counterpart of bulk_delete_always_review)."

  - name: deletes_per_day
    tool: db_delete
    window: day
    metric: calls
    max: 500
    route: REVIEW
    reason: "More than 500 delete calls in one UTC day requires human review."

velocity:
  max_proposals_per_minute: 60
  route: CONFIRM
  reason: "Proposal rate above the per-minute budget - every action requires confirmation while the agent is hot (queue-flood guard)."
